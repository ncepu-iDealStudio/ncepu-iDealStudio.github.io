<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}Fast-Https · 文档{{ else }}{{ .Title }} · Fast-Https 文档{{ end }}</title>
<meta name="description" content="{{ .Site.Params.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "css/main.css" | relURL }}?v={{ (os.Stat "static/css/main.css").ModTime.Unix }}">
</head>
<body{{ if eq .Type "about" }} class="story-page"{{ end }}>
{{ partial "nav.html" . }}
<div class="progress" id="prog"></div>
{{ block "main" . }}{{ end }}
<script src="{{ "js/app.js" | relURL }}?v={{ (os.Stat "static/js/app.js").ModTime.Unix }}"></script>
</body>
</html>
