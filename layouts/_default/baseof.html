<!doctype html>
<html lang="{{ .Site.Language.Locale | default .Site.Language.Lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ i18n "siteSuffix" }}{{ end }}</title>
<meta name="description" content="{{ .Site.Params.description }}">
<meta name="search-index" content="{{ "search-index.json" | relLangURL }}">
<link rel="icon" href="{{ "assets/images/favicon.ico" | relURL }}" type="image/x-icon">
<link rel="shortcut icon" href="{{ "assets/images/favicon.ico" | relURL }}" type="image/x-icon">
<link rel="apple-touch-icon" href="{{ "assets/images/favicon.ico" | relURL }}">
{{/* 字体自托管（scripts/fetch-fonts.mjs 生成），不再依赖 Google Fonts */}}
<link rel="stylesheet" href="{{ "css/fonts.css" | relURL }}?v={{ (os.Stat "static/css/fonts.css").ModTime.Unix }}">
<link rel="stylesheet" href="{{ "css/main.css" | relURL }}?v={{ (os.Stat "static/css/main.css").ModTime.Unix }}">
</head>
<body{{ if eq .Type "about" }} class="story-page"{{ end }}>
{{ partial "nav.html" . }}
<div class="progress" id="prog"></div>
{{ block "main" . }}{{ end }}
<script src="{{ "js/app.js" | relURL }}?v={{ (os.Stat "static/js/app.js").ModTime.Unix }}"></script>
</body>
</html>
