baseURL = 'https://ncepu-idealstudio.github.io/'
locale = 'en-us'
title = 'Fast-Https'
summaryLength = 24
disableKinds = ["taxonomy"]
enableGitInfo = true

# 默认语言英文，直接挂在根路径；中文在 /zh/ 下
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[frontmatter]
  lastmod = ['lastmod', ':git', 'date', 'publishDate']

[outputs]
  home = ["HTML", "SEARCH"]

[outputFormats.SEARCH]
  baseName = "search-index"
  mediaType = "application/json"
  isPlainText = true

[params]
  gitee = 'https://gitee.com/ncepu-bj/fast-https'
  github = 'https://github.com/ncepu-iDealStudio/Fast-Https'
  releases = 'https://github.com/ncepu-iDealStudio/Fast-Https/releases'
  releasesGitee = 'https://gitee.com/ncepu-bj/fast-https/releases'
  # 首页可复制的启动命令（与发行包里的实际命令一致）
  cmdWin = '.\fast-https.exe start'
  cmdLinux = './fast-https start'
  giteeStars = 37

[markup.goldmark.renderer]
  unsafe = true

# 代码高亮改用浅色主题，与纸面白的正文阅读区一致（默认 monokai 深色块会打断阅读节奏）
[markup.highlight]
  style = 'github'
  tabWidth = 2

[languages]
  [languages.zh]
    label = '中文'
    locale = 'zh-CN'
    contentDir = 'content/zh'
    hasCJKLanguage = true
    weight = 2
    title = 'Fast-Https 文档'
    [languages.zh.params]
      description = 'Fast-Https：Windows 可视化 HTTPS 与反向代理管理工具的使用文档。'
      linkStart = 'docs/欢迎/'
      linkInstall = 'docs/软件获取/软件获取与安装/'
      linkTutorial = 'docs/使用教程/基本配置/'
      linkHttps = 'docs/使用教程/配置网站通过HTTPS访问/'
      linkDownload = 'download/'
      linkDocker = 'docs/软件获取/docker/'
      linkSource = 'docs/软件获取/从源代码构建/'
      # 社区入口：拿到飞书群邀请链接后填这里；留空时首页该项显示"待接入"
      linkCommunity = ''

    [[languages.zh.menus.main]]
      name = '文档'
      pageRef = '/docs/欢迎/'
      weight = 1

    [[languages.zh.menus.main]]
      name = '下载'
      pageRef = '/download/'
      weight = 2

    [[languages.zh.menus.main]]
      name = '特性'
      url = '/zh/#features'
      weight = 3

    [[languages.zh.menus.main]]
      name = '社区'
      identifier = 'community'
      url = '/zh/#community'
      weight = 4

  [languages.en]
    label = 'English'
    locale = 'en-US'
    contentDir = 'content/en'
    weight = 1
    title = 'Fast-Https — Automatic HTTPS & Reverse Proxy'
    [languages.en.params]
      description = 'Fast-Https is a visual HTTPS and reverse proxy server for Windows and Linux. Issue certificates, publish sites and manage traffic from one place.'
      linkStart = 'docs/welcome/'
      linkInstall = 'docs/install/'
      linkTutorial = 'docs/tutorial/basic-configuration/'
      linkHttps = 'docs/tutorial/https-access/'
      linkDownload = 'download/'
      linkDocker = 'docs/install/docker/'
      linkSource = 'docs/install/build-from-source/'
      # Community entry: fill in the Feishu group invite URL when available
      linkCommunity = ''

    [[languages.en.menus.main]]
      name = 'Docs'
      pageRef = '/docs/welcome/'
      weight = 1

    [[languages.en.menus.main]]
      name = 'Download'
      pageRef = '/download/'
      weight = 2

    [[languages.en.menus.main]]
      name = 'Features'
      url = '/#features'
      weight = 3

    [[languages.en.menus.main]]
      name = 'Community'
      identifier = 'community'
      url = '/#community'
      weight = 4
