<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方向 A · 环路示波</title>
<style>
  :root{
    --bg:#F1F2F4; --ink:#15181D; --ink-3:#6B7280;
    --red:#C0392B;
    --t0:#0C0F14; --t1:#12171F; --t-line:#222A35;
    --t-txt:#C9D1DC; --t-dim:#65717E; --t-hi:#FF5A3C;
    --serif:"Noto Serif SC","Songti SC",Georgia,serif;
    --sans:"IBM Plex Sans","Noto Sans SC","PingFang SC",system-ui,sans-serif;
    --mono:"IBM Plex Mono","JetBrains Mono",Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);padding:52px 24px 96px}
  .wrap{max-width:1060px;margin:0 auto}
  .cap{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--red);margin-bottom:14px}
  h1{font-family:var(--serif);font-size:clamp(24px,3vw,32px);font-weight:700;letter-spacing:-.02em;line-height:1.2}
  .lede{max-width:56ch;margin-top:12px;font-size:14px;line-height:1.8;color:var(--ink-3)}

  .scope{margin-top:30px;background:var(--t0);border:1px solid #000}
  .scope-h{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--t-line);
    font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--t-dim)}
  .scope-h .live{width:6px;height:6px;background:var(--t-hi);border-radius:50%;flex:none}
  .scope-h .live.on{animation:pulse 1s steps(2,end) infinite}
  @keyframes pulse{50%{opacity:.15}}
  .scope-h .st{margin-left:auto;color:var(--t-txt);letter-spacing:.16em}

  .board{padding:4px 6px 0}
  svg{display:block;width:100%;height:auto}

  .ring{fill:none;stroke:#1D2530;stroke-width:1.4}
  .wire{fill:none;stroke:#1D2530;stroke-width:1.2;stroke-dasharray:3 4}
  .trail{fill:none;stroke:var(--t-hi);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;opacity:.55}
  .pad{fill:var(--t0);stroke:#3A4552;stroke-width:1.4}
  .pad.hit{fill:var(--t-hi);stroke:var(--t-hi)}
  .nm{font-family:var(--mono);font-size:12px;fill:#B7C0CC;paint-order:stroke;stroke:var(--t0);stroke-width:5px;stroke-linejoin:round}
  .rl{font-family:var(--mono);font-size:10.5px;fill:#5A6672;paint-order:stroke;stroke:var(--t0);stroke-width:5px;stroke-linejoin:round}
  .zone{font-family:var(--mono);font-size:10.5px;fill:#3C4653;letter-spacing:.18em}

  .log{height:146px;overflow-y:auto;padding:12px 16px;border-top:1px solid var(--t-line);
    font-family:var(--mono);font-size:12.5px;line-height:1.85;color:var(--t-txt)}
  .log p{display:flex;gap:10px;white-space:nowrap;overflow:hidden}
  .log .t{color:#495462;flex:none}
  .log .lv{color:#7C8896;width:24px;flex:none}
  .log .n{color:var(--t-hi);width:128px;flex:none;overflow:hidden;text-overflow:ellipsis}
  .log .m{color:var(--t-txt);overflow:hidden;text-overflow:ellipsis}
  .log .sys .n{color:#5A6672}
  .log .done .n{color:#93D986}

  form{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--t-line);background:var(--t1)}
  form .sig{font-family:var(--mono);color:var(--t-hi);font-size:14px}
  input{flex:1;background:none;border:0;outline:0;color:#EAEEF4;font-family:var(--mono);font-size:14px;caret-color:var(--t-hi)}
  button{background:none;border:1px solid #2F3946;color:var(--t-dim);font-family:var(--mono);font-size:11px;
    letter-spacing:.14em;padding:5px 12px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--t-hi);color:var(--t-hi)}
  .hint{margin-top:14px;font-family:var(--mono);font-size:12px;color:#8A96A4}
  .hint b{color:var(--ink);font-weight:500}
  @media (max-width:720px){ .log{height:180px} .log p{white-space:normal} }
</style>
</head>
<body>
<div class="wrap">
  <div class="cap">方向 A</div>
  <h1>环路示波</h1>
  <p class="lede">外圈是请求的往返环路，内圈是它中途要扎进去的机房。光点沿环路推进，遇到分发点就拐进内圈，在模块与依赖之间跳几次，再回到环上向客户端回写。</p>

  <div class="scope">
    <div class="scope-h"><span class="live" id="live"></span>fast-https · trace<span class="st" id="st">IDLE</span></div>
    <div class="board"><svg id="svg" viewBox="0 0 1000 626"></svg></div>
    <div class="log" id="log"></div>
    <form id="f">
      <span class="sig">❯</span>
      <input id="cmd" value="curl https://demo.local/api/user" autocomplete="off" spellcheck="false" aria-label="命令">
      <button type="submit">RUN</button>
    </form>
  </div>
  <p class="hint">试试 <b>fast-https start</b> ／ <b>curl https://demo.local/api/user</b></p>
</div>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('svg'), logEl=document.getElementById('log'),
      stEl=document.getElementById('st'), liveEl=document.getElementById('live'), cmdEl=document.getElementById('cmd');

  var CX=500, CY=286, RX=342, RY=150;
  function ell(a){
    var r=a*Math.PI/180;
    return [CX+RX*Math.cos(r), CY+RY*Math.sin(r)];
  }

  // 环上节点（角度）
  var RING=[
    {id:'Client',        a:150, role:'HTTP/1.1 · TLS · H2', lp:'b'},
    {id:'listener',      a:190, role:'sockets / TLS / H2',  lp:'l'},
    {id:'filters',       a:230, role:'parse / route / limits', lp:'t'},
    {id:'core.Services', a:270, role:'lifecycle hooks',     lp:'t'},
    {id:'core.Handler',  a:310, role:'path type → module',  lp:'t'},
    {id:'response',      a:350, role:'headers + security',  lp:'r'}
  ];
  // 内圈机房（L3 / L4）
  var INNER=[
    {id:'appfirewall',     x:318, y:250, role:'WAF adapter'},
    {id:'proxy · ws · tcp',x:500, y:250, role:'upstream / upgrade'},
    {id:'cache · compress',x:682, y:250, role:'disk LRU / gzip br'},
    {id:'GuardianWAF',     x:409, y:330, role:'WAF engine'},
    {id:'Upstream',        x:591, y:330, role:'origin server'}
  ];
  // 底部组合根链（L1）
  var BOOT=[
    {id:'cobra CLI',     x:150, y:556, role:'start / reload / check'},
    {id:'cmd · init',    x:310, y:556, role:'wire handlers + hooks'},
    {id:'config',        x:470, y:556, role:'atomic snapshot'},
    {id:'jsonc · files', x:630, y:556, role:'comments / atomic'},
    {id:'certmanager',   x:790, y:556, role:'ACME control'}
  ];

  var NODE={}, LAYER={};
  RING.forEach(function(n){ var p=ell(n.a); n.x=p[0]; n.y=p[1]; NODE[n.id]=n; LAYER[n.id]='L2'; });
  INNER.forEach(function(n){ NODE[n.id]=n; LAYER[n.id]=(n.y<300?'L3':'L4'); });
  BOOT.forEach(function(n){ NODE[n.id]=n; LAYER[n.id]='L1'; });

  // ---- 静态层 ----
  var g=function(tag,attrs,parent){
    var e=document.createElementNS(NS,tag);
    for(var k in attrs) e.setAttribute(k,attrs[k]);
    (parent||svg).appendChild(e); return e;
  };

  // 环路
  var ringPts=[], i;
  for(i=150;i<=510;i+=1.5){ ringPts.push(ell(i)); }
  g('path',{d:'M'+ringPts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' L'),'class':'ring'});

  // L1 链与汇入环路的虚线
  var bootPath='M'+BOOT.map(function(n){return n.x+' '+n.y;}).join(' L');
  g('path',{d:bootPath,'class':'ring'});

  // 区域标注
  g('text',{x:26,y:112,'class':'zone'}).textContent='L2 运行时 · 请求环路';
  g('text',{x:300,y:204,'class':'zone'}).textContent='L3 · L4 内圈';
  g('text',{x:26,y:512,'class':'zone'}).textContent='L1 组合根';

  // 焊点 + 标签
  var pads={};
  function padNode(n,lp){
    var c=g('circle',{cx:n.x,cy:n.y,r:3.8,'class':'pad'});
    pads[n.id]=c;
    var tx=n.x, ty=n.y, anchor='middle';
    if(lp==='t'){ ty=n.y-26; }
    else if(lp==='b'){ ty=n.y+26; }
    else if(lp==='l'){ tx=n.x-16; anchor='end'; ty=n.y-2; }
    else if(lp==='r'){ tx=n.x+16; anchor='start'; ty=n.y-2; }
    var t=g('text',{x:tx,y:ty,'text-anchor':anchor,'class':'nm'}); t.textContent=n.id;
    if(n.role){
      var s=g('text',{x:tx,y:ty+14,'text-anchor':anchor,'class':'rl'}); s.textContent=n.role;
    }
  }
  RING.forEach(function(n){ padNode(n,n.lp); });
  INNER.forEach(function(n){
    var c=g('circle',{cx:n.x,cy:n.y,r:3.2,'class':'pad'}); pads[n.id]=c;
    var t=g('text',{x:n.x,y:n.y-13,'text-anchor':'middle','class':'nm'}); t.textContent=n.id;
    var s=g('text',{x:n.x,y:n.y+22,'text-anchor':'middle','class':'rl'}); s.textContent=n.role;
  });
  BOOT.forEach(function(n){
    var c=g('circle',{cx:n.x,cy:n.y,r:3.2,'class':'pad'}); pads[n.id]=c;
    var t=g('text',{x:n.x,y:n.y+24,'text-anchor':'middle','class':'nm'}); t.textContent=n.id;
    var s=g('text',{x:n.x,y:n.y+38,'text-anchor':'middle','class':'rl'}); s.textContent=n.role;
  });

  // 轨迹层
  var trailLayer=g('g',{});
  var glow=g('circle',{r:10,fill:'#FF5A3C',opacity:0}); glow.setAttribute('class','');
  var dot=g('circle',{r:4.4,fill:'#fff',opacity:0});

  // ---- 路径构建 ----
  function arcPts(a1,a2){
    var out=[];
    for(var a=a1;a<a2;a+=1.5) out.push(ell(a));
    out.push(ell(a2));
    return out;
  }
  function build(tokens){
    var pts=[], marks=[];
    tokens.forEach(function(tk){
      if(tk.arc){ pts=pts.concat(arcPts(tk.arc[0],tk.arc[1])); }
      else if(tk.n){
        var n=NODE[tk.n];
        pts.push([n.x,n.y]);
        marks.push({id:tk.n,len:0});
      }
    });
    // 累计长度
    var cum=[0], s=0;
    for(var i=1;i<pts.length;i++){ s+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); cum.push(s); }
    marks.forEach(function(m){
      // 找到该节点对应的点（最后一个匹配）
      for(var i=pts.length-1;i>=0;i--){
        if(Math.abs(pts[i][0]-NODE[m.id].x)<0.6 && Math.abs(pts[i][1]-NODE[m.id].y)<0.6){ m.len=cum[i]; break; }
      }
    });
    return {pts:pts,cum:cum,total:s,marks:marks};
  }
  function pointAt(P,d){
    if(d<=0) return P.pts[0];
    if(d>=P.total) return P.pts[P.pts.length-1];
    for(var i=1;i<P.pts.length;i++){
      if(d<=P.cum[i]){
        var k=(d-P.cum[i-1])/(P.cum[i]-P.cum[i-1]||1);
        return [P.pts[i-1][0]+(P.pts[i][0]-P.pts[i-1][0])*k, P.pts[i-1][1]+(P.pts[i][1]-P.pts[i-1][1])*k];
      }
    }
    return P.pts[P.pts.length-1];
  }

  var ROUTES={
    'fast-https start':{
      tokens:[{n:'cobra CLI'},{n:'cmd · init'},{n:'config'},{n:'jsonc · files'},{n:'certmanager'},{n:'core.Services'}],
      logs:{
        'cobra CLI':'$ fast-https start -c ./conf.d','cmd · init':'wire handlers + hooks',
        'config':'parse jsonc → atomic snapshot','jsonc · files':'read conf.d/*.conf ×3',
        'certmanager':'load cert cache · 0 pending','core.Services':'register lifecycle hooks ×5'
      }
    },
    'curl https://demo.local/api/user':{
      tokens:[
        {n:'Client'},
        {arc:[150,190]},{n:'listener'},
        {arc:[190,230]},{n:'filters'},
        {arc:[230,270]},{n:'core.Services'},
        {arc:[270,310]},{n:'core.Handler'},
        {n:'appfirewall'},{n:'GuardianWAF'},{n:'proxy · ws · tcp'},{n:'Upstream'},{n:'cache · compress'},
        {n:'response'},
        {arc:[350,510]}
      ],
      logs:{
        'Client':'GET /api/user · HTTP/2','listener':'accept 10.0.0.7:52341 · TLS1.3 · h2',
        'filters':'parse 1.2KB · route /api/* → proxy','core.Services':'hook request.start ×2',
        'core.Handler':'path type = proxy → module','appfirewall':'adapter → GuardianWAF: pass',
        'GuardianWAF':'inspect body 0.4ms · 0 hits','proxy · ws · tcp':'upstream dial 127.0.0.1:8081',
        'Upstream':'200 OK · 1.8KB · 9ms','cache · compress':'gzip br · cache-control 60s',
        'response':'write headers + security · h2 #1'
      }
    }
  };
  var timer=null, running=false;

  function fmt(){
    var d=new Date();
    return ('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2)+'.'+('00'+d.getMilliseconds()).slice(-3);
  }
  function say(name,msg,cls){
    var p=document.createElement('p'); if(cls) p.className=cls;
    p.innerHTML='<span class="t">'+fmt()+'</span><span class="lv">'+(LAYER[name]||'··')+
      '</span><span class="n">'+name+'</span><span class="m">'+msg+'</span>';
    logEl.appendChild(p); logEl.scrollTop=logEl.scrollHeight;
  }
  function reset(){
    Object.keys(pads).forEach(function(k){pads[k].setAttribute('class','pad');});
    trailLayer.innerHTML=''; dot.setAttribute('opacity',0); glow.setAttribute('opacity',0);
    logEl.innerHTML='';
  }

  function run(cmd){
    if(running) return;
    var spec=ROUTES[cmd.trim()];
    reset();
    if(!spec){
      say('system','no trace for “'+cmd+'” · 试试 fast-https start 或 curl …','sys'); return;
    }
    running=true; stEl.textContent='TRACING'; liveEl.classList.add('on');

    var P=build(spec.tokens);
    var d='M'+P.pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' L');
    var trail=document.createElementNS(NS,'path');
    trail.setAttribute('d',d); trail.setAttribute('class','trail');
    trail.style.strokeDasharray=P.total; trail.style.strokeDashoffset=P.total;
    trailLayer.appendChild(trail);

    var dur=Math.max(1400, P.total*3.4), t0=Date.now(), fired={};
    var marks=P.marks.slice();

    function step(){
      var k=Math.min(1,(Date.now()-t0)/dur);
      var cur=P.total*k;
      var p=pointAt(P,cur);
      dot.setAttribute('cx',p[0]); dot.setAttribute('cy',p[1]); dot.setAttribute('opacity',1);
      glow.setAttribute('cx',p[0]); glow.setAttribute('cy',p[1]); glow.setAttribute('opacity',.55);
      trail.style.strokeDashoffset=P.total*(1-k);

      marks.forEach(function(m){
        if(!fired[m.id] && cur>=m.len-1){
          fired[m.id]=1;
          if(pads[m.id]) pads[m.id].setAttribute('class','pad hit');
          say(m.id, spec.logs[m.id]||'');
        }
      });

      if(k<1){ timer=setTimeout(step,16); }
      else{
        dot.setAttribute('opacity',0); glow.setAttribute('opacity',0);
        stEl.textContent='DONE'; liveEl.classList.remove('on');
        say('system','trace complete · '+P.marks.length+' hops','sys done');
        running=false; timer=null;
      }
    }
    step();
  }

  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault();
    if(timer) clearTimeout(timer);
    running=false; timer=null;
    run(cmdEl.value);
  });

  setTimeout(function(){ run(cmdEl.value); }, 400);
})();
</script>
</body>
</html>
