archKicker: "ARCHITECTURE"
archTitle: "Four layers one request walks through"
archLede: "A cross-section of a real machine: type a command and the dot follows the actual code path through sockets, routing, hooks and modules. Rate limiting, auth, the firewall and the cache are pluggable hooks — switch one off and the path routes around it."
archCmdLbl: "CMD"
archRun: "RUN"
archMwTitle: "middleware · pluggable"
archLogTitle: "trace log"
archHint: "Try: fast-https start ／ curl https://demo.local/api/user ／ curl https://demo.local/index.html ／ hey -n 200 https://demo.local/api/user ／ fast-https reload"
archUnknown: "No trace for this command — try one from the hint"
archL1t: "Composition root"
archL2t: "Runtime"
archL3t: "Pluggable modules"
archL4t: "Dependencies"
trIdle: "Press RUN: the dot stops at every station and explains what happens there."
trSkip: "SKIP"
trClientT: "Client"
trClientD: "The browser starts a request: TLS handshake first, then one reused HTTP/2 connection."
trListenerT: "Listener"
trListenerD: "Accepts the connection, reads ClientHello and picks the certificate for that server_name."
trSafeT: "Rate limit & blocklist"
trSafeD: "Token-bucket rate limit per IP; a listed IP gets 403. Both run at connect time, before parsing."
trEventsT: "Parse"
trEventsD: "Reads the request line and headers; a Host that matches no server_name returns 421."
trFiltersT: "Route"
trFiltersD: "Picks a rule by server_name + location prefix: start-anchored first, then the longer match."
trAuthT: "Basic auth"
trAuthD: "Checks the Authorization header; failure returns 401 with a WWW-Authenticate challenge."
trWafT: "Application firewall"
trWafD: "Scores SQL injection, XSS, path traversal and command injection; a hit returns 403 and closes."
trHandlerT: "Dispatch"
trHandlerD: "Looks up the handler registry by location type and gets parse / filter / execute."
trModuleT: "Static / reverse proxy"
trModuleD: "Static reads local files with Range and 304; proxy dials upstream and forwards."
trCacheT: "Response cache"
trCacheD: "Proxy paths only: a key hit replays the stored response and skips the upstream round trip."
trTargetT: "Upstream"
trTargetD: "The real service, answering with a status line, headers and a body."
trCompressT: "Compression"
trCompressD: "Static responses pick br or gzip from Accept-Encoding and compress before writing."
trResponseT: "Write response"
trResponseD: "Adds security headers and writes through one exit; HTTP/2 sends it back per stream."
trCliT: "CLI"
trCliD: "Parses the start / reload / check subcommands."
trInitT: "Composition root"
trInitD: "Injects handlers and hooks into core once per process."
trConfigT: "Config snapshot"
trConfigD: "Reads and validates JSONC, then atomically swaps the snapshot — readers never see half a config."
trConfdT: "Site files"
trConfdD: "Loads site files from conf.d; site edits are written back here."
trCertT: "Certificates"
trCertD: "Loads certificates and ACME state; renewal hot-swaps the certificate list."
trListenT: "Listeners"
trListenD: "Binds a socket per port; reload only swaps the snapshot for an unchanged port."
trHooksT: "Post-listen hooks"
trHooksD: "Initialises limits and blocklist, rebuilds the WAF engine, re-registers log fields."
